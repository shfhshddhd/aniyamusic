name: AniyaMusic Controller

on:
  workflow_dispatch:

concurrency:
  group: aniyamusic-controller
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Recover worker and rotate controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-aniyamusic.yml"
          CONTROLLER_WORKFLOW="aniyamusic-controller.yml"
          BRANCH="main"
          CONTROLLER_HANDOVER_MINUTES=335
          controller_started="$(date -u +%s)"
          handover_done=false
          last_recovery=0

          dispatch_worker() {
            echo "Dispatching AniyaMusic worker."
            gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"
          }

          active_workers() {
            gh run list --repo "$REPO" --workflow "$WORKFLOW" --branch "$BRANCH" --limit 100 \
              --json databaseId,status,createdAt,number |
              jq '[.[] | select(
                .status == "queued" or .status == "in_progress" or
                .status == "waiting" or .status == "pending" or .status == "requested"
              ) | {id: .databaseId, status: .status, created_at: .createdAt, run_number: .number}] |
              sort_by(.created_at)'
          }

          while true; do
            now="$(date -u +%s)"
            age_minutes=$(( (now - controller_started) / 60 ))
            if (( age_minutes >= CONTROLLER_HANDOVER_MINUTES )); then
              if [[ "$handover_done" == "false" ]]; then
                handover_done=true
                echo "Controller reached 5h35m; dispatching its replacement and exiting cleanly."
                gh workflow run "$CONTROLLER_WORKFLOW" --repo "$REPO" --ref "$BRANCH"
              fi
              exit 0
            fi

            active="$(active_workers)"
            count="$(jq 'length' <<< "$active")"
            echo "Active/queued AniyaMusic workers: $count"
            jq . <<< "$active"

            if (( count == 0 )); then
              if (( now - last_recovery >= 120 )); then
                echo "No worker is active or queued; starting recovery worker."
                dispatch_worker
                last_recovery=$now
              else
                echo "Recovery cooldown active."
              fi
            fi
            sleep 30
          done
