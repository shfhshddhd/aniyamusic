# AniyaMusic worker adapted to this repository's Python entry point.
name: Run AniyaMusic

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

# A successor may be queued, but must never run alongside the current worker.
concurrency:
  group: aniyamusic-worker
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      LOGGER_ID: ${{ secrets.LOGGER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      BOT_NAME: ${{ secrets.BOT_NAME || 'AniyaMusic' }}
      STRING_SESSION: ${{ secrets.STRING_SESSION }}
      STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
      STRING_SESSION3: ${{ secrets.STRING_SESSION3 }}
      STRING_SESSION4: ${{ secrets.STRING_SESSION4 }}
      STRING_SESSION5: ${{ secrets.STRING_SESSION5 }}
      STRING_SESSION6: ${{ secrets.STRING_SESSION6 }}
      STRING_SESSION7: ${{ secrets.STRING_SESSION7 }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      DURATION_LIMIT: ${{ secrets.DURATION_LIMIT || '17000' }}
      AUTO_LEAVING_ASSISTANT: ${{ secrets.AUTO_LEAVING_ASSISTANT || 'True' }}
      ASSISTANT_LEAVE_TIME: ${{ secrets.ASSISTANT_LEAVE_TIME || '9000' }}
      PLAYLIST_FETCH_LIMIT: ${{ secrets.PLAYLIST_FETCH_LIMIT || '25' }}
      TG_AUDIO_FILESIZE_LIMIT: ${{ secrets.TG_AUDIO_FILESIZE_LIMIT || '5242880000' }}
      TG_VIDEO_FILESIZE_LIMIT: ${{ secrets.TG_VIDEO_FILESIZE_LIMIT || '5242880000' }}
      START_IMG_URL: ${{ secrets.START_IMG_URL }}
      PING_IMG_URL: ${{ secrets.PING_IMG_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPPORT_CHANNEL: ${{ secrets.SUPPORT_CHANNEL }}
      SUPPORT_CHAT: ${{ secrets.SUPPORT_CHAT }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO || 'https://github.com/shfhshddhd/aniyamusic' }}
      UPSTREAM_BRANCH: ${{ secrets.UPSTREAM_BRANCH || 'main' }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Checkout AniyaMusic
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg aria2 git curl build-essential gcc libffi-dev libssl-dev
          ffmpeg -version | head -n 1

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in API_ID API_HASH BOT_TOKEN MONGO_DB_URI OWNER_ID LOGGER_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if [[ -z "$STRING_SESSION" && -z "$STRING_SESSION2" && -z "$STRING_SESSION3" && -z "$STRING_SESSION4" && -z "$STRING_SESSION5" ]]; then
            missing+=("at least one of STRING_SESSION through STRING_SESSION5")
          fi
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Prepare private YouTube cookies
        shell: bash
        run: |
          set -euo pipefail
          cookie_file="ANIYAXMUSIC/assets/cookies.txt"
          mkdir -p "$(dirname "$cookie_file")"
          if [[ -n "${YOUTUBE_COOKIES:-}" ]]; then
            first_line="$(printf '%s' "$YOUTUBE_COOKIES" | head -n 1)"
            if [[ "$first_line" != "# Netscape HTTP Cookie File" && "$first_line" != "# HTTP Cookie File" ]]; then
              echo "::error::YOUTUBE_COOKIES must contain a Netscape-format cookies.txt file."
              exit 1
            fi
            printf '%s' "$YOUTUBE_COOKIES" > "$cookie_file"
            chmod 600 "$cookie_file"
            echo "Private YouTube cookie file prepared."
          else
            printf '# Netscape HTTP Cookie File\n' > "$cookie_file"
            chmod 600 "$cookie_file"
            echo "::warning::YOUTUBE_COOKIES secret is not set; YouTube may reject downloads that require login."
          fi

      - name: Patch legacy PyTgCalls update compatibility
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_pytgcalls.py

      - name: Start AniyaMusic
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/aniyamusic.log"
          pid_file="$RUNNER_TEMP/aniyamusic.pid"
          : > "$log_file"
          nohup bash start >"$log_file" 2>&1 </dev/null &
          echo "$!" > "$pid_file"
          echo "AniyaMusic started with PID $(cat "$pid_file")."
          echo "ANIYAMUSIC_LOG=$log_file" >> "$GITHUB_ENV"
          echo "ANIYAMUSIC_PID_FILE=$pid_file" >> "$GITHUB_ENV"

      - name: Verify bot startup
        shell: bash
        run: |
          set -euo pipefail
          # This project does not emit the reference workflow's startup marker.
          # Check process survival and surface startup logs if it exits.
          for attempt in $(seq 1 45); do
            pid="$(cat "$ANIYAMUSIC_PID_FILE")"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::AniyaMusic exited during startup. Recent logs:"
              tail -n 150 "$ANIYAMUSIC_LOG" || true
              exit 1
            fi
            if (( attempt >= 15 )); then
              echo "AniyaMusic process remained alive through the startup check."
              exit 0
            fi
            sleep 2
          done

      - name: Monitor and queue successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tail -n 0 -F "$ANIYAMUSIC_LOG" &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT

          started="$(date +%s)"
          dispatched=false
          while true; do
            pid="$(cat "$ANIYAMUSIC_PID_FILE")"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::AniyaMusic process stopped. Recent logs:"
              tail -n 150 "$ANIYAMUSIC_LOG" || true
              exit 1
            fi

            age=$(( $(date +%s) - started ))
            # Queue the next worker at 5h35m; concurrency prevents overlap.
            if (( age >= 20100 )) && [[ "$dispatched" == "false" ]]; then
              echo "Queueing successor before the runner time limit."
              gh workflow run run-aniyamusic.yml --repo "$GITHUB_REPOSITORY" --ref main
              dispatched=true
              echo "Successor queued; current worker remains the only active worker."
            fi
            sleep 30
          done
